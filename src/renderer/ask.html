<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>itqan Shield — confirm</title>
  <link rel="stylesheet" href="ask.css" />
</head>
<body>
  <header class="ask-head">
    <div class="mark" aria-hidden="true">
      <svg width="18" height="22" viewBox="0 0 22 26">
        <path d="M11 1 L21 4 V12 C21 18.5 16.8 22.6 11 25 C5.2 22.6 1 18.5 1 12 V4 Z" fill="#0A0A0A"/>
        <rect x="9.2" y="9" width="3.6" height="8" fill="#EAB308"/>
        <rect x="7" y="11.2" width="8" height="3.6" fill="#EAB308"/>
      </svg>
    </div>
    <div>
      <h1>Blocked word detected</h1>
      <p class="sub" id="agent-line">agent</p>
    </div>
  </header>

  <main>
    <div class="hit">
      <span class="tag" id="category-tag">category</span>
      <span class="keyword" id="keyword-text">keyword</span>
      <span class="muted" id="match-note"></span>
    </div>
    <p class="context" id="context"></p>
    <p class="note" id="deny-note">Deny — this request never leaves your device.</p>
  </main>

  <footer class="ask-actions">
    <button id="deny" class="btn ghost">Deny</button>
    <button id="session" class="btn">Allow for this session</button>
    <button id="allow" class="btn primary">Allow once</button>
  </footer>

  <script src="ask.js"></script>
</body>
</html>
